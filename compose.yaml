# This compose file creates the multimodal search services, including
# a PostgreSQL database with the pgvector plugin built in.

services:

  mm-search-clip-app:
    build:
      context: ./clip_app
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      # Is the CLIP app service ready to respond to queries?
      test: [ "CMD", "python3", "-c", "import httpx; httpx.get('http://127.0.0.1:8000/started').raise_for_status()" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  mm-search-query-app:
    build:
      context: ./query_app
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@mm-search-postgres-db:5432/${POSTGRES_DB}
      CLIP_SERVICE_URL: http://mm-search-clip-app:8000
    depends_on:
      mm-search-postgres-db:
       condition: service_healthy
      mm-search-clip-app:
        condition: service_healthy

  mm-search-postgres-db:
   image: pgvector/pgvector:pg17
   environment:
     POSTGRES_DB: ${POSTGRES_DB}
     POSTGRES_USER: ${POSTGRES_USER}
     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
   healthcheck:
     test: [ "CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
     interval: 5s
     timeout: 5s
     retries: 5
